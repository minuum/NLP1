[tool.poetry]
name = "t5-arxiv-title-generator"
version = "0.1.0"
description = "T5 model for generating titles from arXiv abstracts"
authors = ["Minu <minwool0357@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
torch = "^2.0.0" # Apple Silicon (MPS) 호환성 고려
transformers = "^4.30.0" # Hugging Face Transformers 최신 버전 확인
datasets = "^2.10.0"
evaluate = "^0.4.0"
sentence-transformers = "^2.2.0"
scikit-learn = "^1.3.0"
nltk = "^3.8.0"
pandas = "^2.0.0"
numpy = "^1.24.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
tqdm = "^4.65.0"
kagglehub = "^0.2.0"
absl-py = "^1.4.0"
rouge-score = "^0.1.2"
accelerate = ">=0.26.0"
tensorboard = "^2.10.0"
jupyter = "^1.1.1"
ipykernel = "^6.29.5"
notebook = "^7.0.0"
sentencepiece = "^0.2.0"
torchvision = "^0.22.0"
bleu = "^0.3"
sacrebleu = "^2.5.1"
bert-score = "^0.3.13"
py-rouge = "^1.1"
textstat = "^0.7.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
flake8 = "^6.0"

[tool.poetry.extras]
kaggle = ["kagglehub"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"